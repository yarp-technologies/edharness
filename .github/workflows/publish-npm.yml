name: Publish EdHarness npm CLI

on:
  push:
    tags:
      - edharness-v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare release version
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_version="$package_version"
          else
            tag_version="${GITHUB_REF_NAME#edharness-v}"
          fi
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Release tag version $tag_version does not match package version $package_version"
            exit 1
          fi
          {
            echo "OPENCODE_CHANNEL=edharness"
            echo "OPENCODE_VERSION=$package_version-edharness"
            echo "OPENCODE_CLI_NAME=edharness"
          } >> "$GITHUB_ENV"

      - name: Build platform binaries
        run: bun run --cwd packages/cli build --outdir=dist/npm
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Prepare npm packages
        run: node npm/pack.cjs

      - name: Publish platform packages
        shell: bash
        run: |
          publish_package() {
            local package="$1"
            local name
            local version
            name="$(node -p "require('./$package/package.json').name")"
            version="$(node -p "require('./$package/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "already published $name@$version"
              return
            fi
            local stages
            stages="$(npm stage list "$name" --json 2>/dev/null || true)"
            if printf '%s' "$stages" | node -e '
              let input = ""
              process.stdin.on("data", (chunk) => (input += chunk))
              process.stdin.on("end", () => {
                let staged
                try {
                  staged = JSON.parse(input)
                } catch {
                  process.exit(1)
                }
                const containsVersion = (value) => {
                  if (value === process.argv[1]) return true
                  if (Array.isArray(value)) return value.some(containsVersion)
                  if (value && typeof value === "object") return Object.values(value).some(containsVersion)
                  return false
                }
                process.exit(containsVersion(staged) ? 0 : 1)
              })
            ' "$version"; then
              echo "already staged $name@$version"
              return
            fi
            npm stage publish "$package" --access public --provenance
          }
          for package in npm/dist/edharness-*; do
            publish_package "$package"
          done
          publish_package npm/dist/edharness
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
